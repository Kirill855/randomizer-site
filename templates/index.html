<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }

        .corner-label {
            position: fixed;
            top: 20px;
            right: 25px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 10px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            user-select: none;
            z-index: 10;
        }

        .layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
        }

        .cat {
            font-size: 90px;
            line-height: 1;
            user-select: none;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.25));
        }

        .cat.left  { animation-delay: 0s; }
        .cat.right { animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-18px); }
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 15px;
            color: #a0aec0;
            margin-bottom: 30px;
        }

        button {
            font-size: 18px;
            font-weight: 600;
            padding: 16px 48px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(102, 126, 234, 0.55);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #cbd5e0;
            box-shadow: none;
            cursor: not-allowed;
        }

        #message {
            margin-top: 36px;
            min-height: 80px;
            font-size: 22px;
            line-height: 1.5;
            color: #2d3748;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 20px;
            border-radius: 14px;
            background: #f7fafc;
            border: 2px dashed #e2e8f0;
            transition: all 0.3s;
        }

        #message.active {
            background: #ebf8ff;
            border-color: #667eea;
            border-style: solid;
        }

        #message.finished {
            background: #fff5f5;
            border-color: #fc8181;
            border-style: solid;
            color: #c53030;
        }

        @media (max-width: 900px) {
            .cat { display: none; }
        }
    </style>
</head>
<body>
    <div class="corner-label">ДДА-111</div>

    <div class="layout">
        <div class="cat left">🐱</div>

        <div class="card">
            <h1>Рандомайзер</h1>
            <p class="subtitle">Нажмите кнопку, чтобы выбрать следущего студента</p>

            <button type="button" id="nextBtn" onclick="getNextMessage()">Следующий студент</button>

            <div id="message"></div>
        </div>

        <div class="cat right">🐈</div>
    </div>

    <script>
        const btn = document.getElementById('nextBtn');
        const msgDiv = document.getElementById('message');

        async function getNextMessage() {
            msgDiv.className = '';
            msgDiv.textContent = 'Загрузка...';
            msgDiv.classList.add('active');

            try {
                const response = await fetch('/api/next', { method: 'POST' });
                const data = await response.json();

                if (data.message) {
                    msgDiv.textContent = data.message;
                    msgDiv.classList.add('active');
                } else if (data.finished) {
                    msgDiv.textContent = 'Студенты закончились.';
                    msgDiv.className = 'finished';
                    btn.disabled = true;
                } else {
                    msgDiv.textContent = data.info || 'Всё сломалось.';
                    msgDiv.classList.add('active');
                }
            } catch (error) {
                msgDiv.textContent = 'Ошибка соединения с сервером.';
                msgDiv.className = 'finished';
            }
        }
    </script>
</body>
</html>
